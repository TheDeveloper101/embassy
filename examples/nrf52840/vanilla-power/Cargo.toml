[package]
name = "nrf52840-vanilla-power"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "21863c31db0df77ba4922ce1dbc79a9e1dd972a1", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "21863c31db0df77ba4922ce1dbc79a9e1dd972a1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "21863c31db0df77ba4922ce1dbc79a9e1dd972a1", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "time"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
